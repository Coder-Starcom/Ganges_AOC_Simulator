<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NITW Aviation Routing System</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
      }
      .header {
        background-color: #2c3e50;
        color: white;
        padding: 1.5rem;
        text-align: center;
        margin-bottom: 20px;
      }
      .container {
        display: flex;
        max-width: 1300px;
        margin: 0 auto;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        background: white;
        border-radius: 8px;
        overflow: hidden;
      }

      .map-section {
        flex: 7;
        height: 650px;
      }
      .control-section {
        flex: 3;
        padding: 30px;
        background-color: #ffffff;
        border-left: 2px solid #ecf0f1;
        display: flex;
        flex-direction: column;
      }

      .card {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #e9ecef;
      }
      p {
        font-size: 15px;
        margin-bottom: 10px;
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button.action-btn {
        flex: 1;
        background-color: #27ae60;
        color: white;
        border: none;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }
      button.action-btn:hover {
        background-color: #219150;
      }

      button.reset-btn {
        flex: 1;
        background-color: #95a5a6;
        color: white;
        border: none;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.3s;
      }
      button.reset-btn:hover {
        background-color: #7f8c8d;
      }

      /* Dijkstra Metrics Panel */
      .metrics {
        display: none;
        background: #e8f4f8;
        padding: 15px;
        border-radius: 8px;
        border-left: 5px solid #3498db;
        margin-top: 10px;
      }
      .metrics span {
        font-weight: bold;
        color: #2980b9;
        font-size: 1.1em;
      }

      #output {
        padding: 15px;
        border-radius: 5px;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 style="margin: 0">✈️ NITW Aviation Economic Graph (Dijkstra)</h1>
    </div>

    <div class="container">
      <div class="map-section" id="map-container">{{ map_html|safe }}</div>

      <div class="control-section">
        <h2 style="margin-top: 0; color: #2c3e50">Route Controls</h2>

        <div class="card">
          <p>
            <strong>🛫 Source:</strong>
            <span id="source_val" style="color: #e74c3c; font-weight: bold"
              >None</span
            >
          </p>
          <p>
            <strong>🛬 Target:</strong>
            <span id="dest_val" style="color: #e74c3c; font-weight: bold"
              >None</span
            >
          </p>
        </div>

        <div class="btn-group">
          <button class="action-btn" onclick="sendQuery()">
            Calculate Route
          </button>
          <button class="reset-btn" onclick="resetApp()">New Query</button>
        </div>

        <div id="output" style="display: none"></div>

        <div id="metrics-panel" class="metrics">
          <h3 style="margin-top: 0; color: #2c3e50; font-size: 16px">
            Algorithm Results
          </h3>
          <p>Path: <br /><span id="res_path">-</span></p>
          <p>Total Economic Fare: <br />₹<span id="res_fare">0.00</span></p>
          <p>Total Physical Distance: <br /><span id="res_dist">0</span> km</p>
        </div>
      </div>
    </div>

    <script>
      let selection = { source: null, dest: null };

      window.addEventListener("message", (event) => {
        if (event.data && event.data.action === "setPoint") {
          selection[event.data.type] = event.data.id;
          document.getElementById(event.data.type + "_val").innerText =
            event.data.id;
          document.getElementById(event.data.type + "_val").style.color =
            "#27ae60";
        }
      });

      async function sendQuery() {
        const outputDiv = document.getElementById("output");
        outputDiv.style.display = "block";
        outputDiv.className = "";
        outputDiv.innerText = "Running Dijkstra...";
        document.getElementById("metrics-panel").style.display = "none";

        try {
          const response = await fetch("/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(selection),
          });
          const data = await response.json();

          if (!response.ok) {
            outputDiv.className = "error";
            outputDiv.innerText = data.error;
            return;
          }

          outputDiv.className = "success";
          outputDiv.innerText = data.message;

          // Populate Dijkstra Results
          document.getElementById("res_path").innerText = data.route_str;
          document.getElementById("res_fare").innerText = data.fare;
          document.getElementById("res_dist").innerText = data.distance;
          document.getElementById("metrics-panel").style.display = "block";

          // Update map (grays out nodes, draws line)
          if (data.map_html) {
            document.getElementById("map-container").innerHTML = data.map_html;
          }
        } catch (err) {
          outputDiv.className = "error";
          outputDiv.innerText = "Server Error.";
        }
      }

      async function resetApp() {
        // Reset logic and UI
        selection = { source: null, dest: null };
        document.getElementById("source_val").innerText = "None";
        document.getElementById("source_val").style.color = "#e74c3c";
        document.getElementById("dest_val").innerText = "None";
        document.getElementById("dest_val").style.color = "#e74c3c";

        document.getElementById("output").style.display = "none";
        document.getElementById("metrics-panel").style.display = "none";

        // Fetch a fresh default map from the server
        const response = await fetch("/reset");
        const data = await response.json();
        document.getElementById("map-container").innerHTML = data.map_html;
      }
    </script>
  </body>
</html>
